base_url = "https://axlr.underpassai.com"
title = "AXLR"
description = "AXLR is an open-source agent runtime in Go. Agents forge the tools they lack, you approve them, and AXLR keeps them, checked by digest, for later sessions. A console, an mTLS HTTP/gRPC/MCP service, a JSON worker and a Go library, with KMP for memory and MADE for agent workflows."
default_language = "en"
compile_sass = true
minify_html = false
build_search_index = true
generate_feeds = false

[markdown]
smart_punctuation = false
external_links_target_blank = false

[markdown.highlighting]
theme = "github-light"

[slugify]
paths = "safe"
anchors = "on"

[search]
index_format = "elasticlunr_json"
include_title = true
include_description = true
include_content = true
truncate_content_length = 2000

[extra]
github = "https://github.com/underpass-ai/AXLR"
registry = "https://registry.underpassai.com"
